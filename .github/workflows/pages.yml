name: Deploy web interface to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build and test
        run: |
          npm run check
          node --import tsx --test test/*.test.ts
      - name: Build static web interface
        env:
          WEB_STATIC: 'true'
          WEB_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          WEB_STRIKER_URL: ${{ vars.WEB_STRIKER_URL }}
          WEB_ASSET_ID: ${{ vars.WEB_ASSET_ID }}
          # Migrate the existing demo's display name without changing its asset ID or decimals.
          WEB_ASSET_SYMBOL: ${{ vars.WEB_ASSET_SYMBOL == 'POC' && 'USD' || vars.WEB_ASSET_SYMBOL || 'USD' }}
          WEB_ASSET_NAME: ${{ vars.WEB_ASSET_NAME || 'Striker demo USD' }}
          WEB_ASSET_DECIMALS: ${{ vars.WEB_ASSET_DECIMALS || '0' }}
          STRIKER_NETWORK: mutinynet
          STRIKER_EMULATOR: hosted
          ARK_URL: ${{ vars.ARK_URL || 'https://mutinynet.arkade.sh' }}
          EMULATOR_URL: ${{ vars.EMULATOR_URL || 'https://emulator.mutinynet.arkade.sh' }}
          EMULATOR_PUBKEY: ${{ vars.EMULATOR_PUBKEY }}
          ESPLORA_URL: ${{ vars.ESPLORA_URL || 'https://mempool.mutinynet.arkade.sh/api' }}
        run: |
          if [ "$EMULATOR_URL" != "https://emulator.mutinynet.arkade.sh" ] && [ -z "$EMULATOR_PUBKEY" ]; then
            echo '::error::Set EMULATOR_PUBKEY when using a custom Emulator endpoint.'
            exit 1
          fi
          # An empty Actions variable must not override the SDK's default pin.
          if [ -z "$EMULATOR_PUBKEY" ]; then unset EMULATOR_PUBKEY; fi
          npm run build --workspace @satora/web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
